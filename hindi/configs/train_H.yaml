# Hindi training hyperparameters — locked defaults, see project specifications Section 1
micro_batch_size: 64            # physical batch on GPU per forward pass
gradient_accumulation_steps: 1  # effective batch = 64 sequences
effective_batch_size: 64        # 64 * 512 = 32,768 tokens per optimizer step
learning_rate: 6.0e-4
min_lr: 6.0e-5
warmup_steps: 300               # ~2% of total 15259 steps
max_steps: 15259                # 500M tokens at 32,768 tokens/step
max_grad_norm: 1.0
weight_decay: 0.1
eval_interval: 250
save_interval: 2500
mixed_precision: true           # fp16 via torch.cuda.amp.GradScaler
seed: 1337
