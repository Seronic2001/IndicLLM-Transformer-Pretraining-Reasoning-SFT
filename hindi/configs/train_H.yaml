# Hindi training hyperparameters — locked defaults,
micro_batch_size: 32            # physical batch on GPU per forward pass
gradient_accumulation_steps: 16 # effective batch = 32 * 16 = 512 sequences
effective_batch_size: 512       # 512 * 512 = 262,144 tokens per optimizer step
learning_rate: 6.0e-4
min_lr: 6.0e-5
warmup_steps: 40                # ~2% of total 1907 steps
max_steps: 1907                 # 500M tokens at 262,144 tokens/step
max_grad_norm: 1.0
weight_decay: 0.1
eval_interval: 100
save_interval: 500
mixed_precision: true           # fp16 via torch.cuda.amp.GradScaler
seed: 1337
