# Assamese Model L — Option A (default & recommended), locked config, see AGENT_BUILD_SPEC.md §1
# Target: ~25.76M params (rubric window 22.5M–27.5M)
vocab_size: 32768
d_model: 384
n_layer: 6
n_head: 6          # d_k = 64
d_ff: 2048
block_size: 512    # max context length, bounded by learned pos-emb table
dropout: 0.1
tie_weights: true
bias: false        # no bias in Linear layers (GPT-2 style)
