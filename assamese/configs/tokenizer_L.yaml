# Assamese tokenizer — SentencePiece with Indic Enhancements & BPE/Unigram Support 
model_type: bpe                 # default baseline; overridden or compared in train_tokenizer.py
vocab_size: 32768               # candidate {16384, 32768}; decided via fertility on val.txt
byte_fallback: true             # critical for Assamese: smaller corpus, rarer glyphs
character_coverage: 1.0         # 100% coverage guarantees zero dropped Indic glyphs
split_digits: true              # isolate digits to save thousands of vocabulary slots
split_by_unicode_script: true   # prevent cross-script token merges
split_by_whitespace: true       # treat whitespace as token boundary
normalization_rule_name: nfkc   # canonical Unicode normalization
pad_id: 0
unk_id: 1
bos_id: 2
eos_id: 3
input_sentence_size: 2000000
candidate_vocab_sizes: [16384, 32768]
candidate_model_types: ["bpe", "unigram"]
